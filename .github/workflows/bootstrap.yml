name: Bootstrap implementation

on:
  push:
    branches: [agent/implement-monitor]

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/implement-monitor
      - name: Unpack verified project tree
        shell: bash
        run: |
          cat > /tmp/project.b64 <<'ARCHIVE'
[...truncated...]
ARCHIVE
          base64 -d /tmp/project.b64 > /tmp/project.tgz
          tar -xzf /tmp/project.tgz -C .
          rm -f .github/workflows/bootstrap.yml
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git add -A
          git commit -m "feat: implement government contract IPO monitor"
          git push origin HEAD:agent/implement-monitor
