name: Publish container

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    concurrency:
      group: container-publication
      cancel-in-progress: false
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - name: Check out verified revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate container metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and publish container
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record successful publication
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deployments
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          record = {
              "image": f"{os.environ['IMAGE']}:latest",
              "source_sha": os.environ["SOURCE_SHA"],
              "published_at": datetime.now(timezone.utc).isoformat(),
              "platform": "linux/amd64",
              "registry": "ghcr.io",
          }
          Path("deployments/container.json").write_text(
              json.dumps(record, indent=2) + "\n", encoding="utf-8"
          )
          PY
      - name: Save publication receipt
        uses: actions/upload-artifact@v4
        with:
          name: container-publication
          path: deployments/container.json
          retention-days: 90
