name: Company, IPO and trade research monitor

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/**', 'pyproject.toml', '.github/workflows/monitor.yml', 'scripts/restore_checkpoint.py', 'scripts/select_checkpoint.cjs']

permissions:
  contents: read
  actions: read

concurrency:
  group: ipo-monitor-production
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT || 'CompanyTradeResearchMonitor/0.5 edwin.s.hou@gmail.com' }}
      DATABASE_PATH: data/monitor.db
      SMTP_ENABLED: 'false'
      LISTED_DISCOVERY_ENABLED: ${{ vars.LISTED_DISCOVERY_ENABLED || 'true' }}
      LISTED_DISCOVERY_MAX_NEW_CIKS: ${{ vars.LISTED_DISCOVERY_MAX_NEW_CIKS || '5' }}
      LISTED_DISCOVERY_MAX_CANDIDATES: ${{ vars.LISTED_DISCOVERY_MAX_CANDIDATES || '25' }}
      WATCH_COMPANIES: ${{ vars.WATCH_COMPANIES || 'Anduril,SpaceX,OpenAI,Anthropic,Databricks,Stripe' }}
      YOUTUBE_VIDEO_URLS: ${{ vars.YOUTUBE_VIDEO_URLS || 'https://youtu.be/0BE2AAOlYWI' }}
      NEWS_FEED_URLS: ${{ vars.NEWS_FEED_URLS }}
      FORUM_FEED_URLS: ${{ vars.FORUM_FEED_URLS || 'https://forum.valuepickr.com/latest.rss' }}
      WATCH_SYMBOLS: ${{ vars.WATCH_SYMBOLS }}
      REDDIT_ACCESS_TOKEN: ${{ secrets.REDDIT_ACCESS_TOKEN }}
      REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
      REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
      REDDIT_REFRESH_TOKEN: ${{ secrets.REDDIT_REFRESH_TOKEN }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      SAM_API_KEY: ${{ secrets.SAM_API_KEY }}
      TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
      SOURCE_TIMEOUT_SECONDS: '600'
      SEC_MAX_DOCUMENT_BYTES: ${{ vars.SEC_MAX_DOCUMENT_BYTES || '52428800' }}
      USASPENDING_MAX_PAGES: '250'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e .
      - name: Restore last durable monitor checkpoint
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const {selectCheckpoint} = require(process.env.GITHUB_WORKSPACE + '/scripts/select_checkpoint.cjs');
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              ...context.repo, name: 'ipo-monitor-state', per_page: 100
            });
            const selected = await selectCheckpoint(artifacts,
              async id => (await github.rest.actions.getWorkflowRun({...context.repo, run_id:id})).data,
              {repository: `${context.repo.owner}/${context.repo.repo}`, currentRunId:context.runId});
            if (selected) {
              const {artifact, run} = selected;
              const download = await github.rest.actions.downloadArtifact({...context.repo, artifact_id: artifact.id, archive_format:'zip'});
              const data = Buffer.from(download.data);
              if (!data.length || data.length > 250000000) throw new Error('Checkpoint archive exceeds download bounds');
              fs.mkdirSync('work', {recursive:true});
              fs.writeFileSync('work/checkpoint.zip', data);
              core.info(`Restoring checkpoint from run ${run.id}, artifact ${artifact.id}; artifact created ${artifact.created_at}, run created ${run.created_at}`);
              return;
            }
            core.info('No retained checkpoint exists. Starting a new collection history.');
      - name: Validate and install checkpoint
        run: python scripts/restore_checkpoint.py
      - name: Collect and write research report
        run: gov-contract-ipo-monitor run-once --report-dir data/reports --checkpoint work/checkpoint/monitor.db
      - name: Publish report to run summary
        if: always()
        shell: bash
        run: |
          if test -f data/reports/latest.md; then
            cat data/reports/latest.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No completed research report. See the failed step; collection is not confirmed.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve state for the next run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipo-monitor-state
          path: work/checkpoint/monitor.db
          if-no-files-found: warn
          retention-days: 90
      - name: Preserve reviewable report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipo-monitor-report
          path: data/reports/
          if-no-files-found: warn
          retention-days: 30
