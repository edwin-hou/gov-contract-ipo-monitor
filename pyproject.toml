[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gov-contract-ipo-monitor"
version = "0.1.0"
description = "Evidence-gated government contract and near-term IPO email monitor"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Edwin Hou"}]
dependencies = [
  "fastapi>=0.110",
  "httpx>=0.27",
  "pydantic>=2.8",
  "python-dotenv>=1.0",
  "typer>=0.12",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23"]

[project.scripts]
gov-contract-ipo-monitor = "contract_ipo_monitor.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
